<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Dino Game</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game" class="game">
    <div id="score" class="score">0</div>
    <div id="start-message" class="start-message">Press any key to start</div>
    <img src="./offline-game/ground.png" class="ground" alt="ground"/>
    <img src="./offline-game/cactus.png" class="cactus" alt="cactus"/>
    <img src="./offline-game/dino-run-0.png" class="dino" alt="dino run 0"/>
    <img src="./offline-game/dino-run-1.png" class="dino" alt="dino run 1"/>
    <img src="./offline-game/dino-stationary.png" id="dino" class="dino" alt="dino stationary"/>
    <div id="gameover-message" class="gameover-message hide">
      <p>Game over</p>
      <span>Press any key to restart</span>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((registration) => {
            console.log('Service Worker registered with scope:', registration.scope);
          })
          .catch((error) => {
            console.error('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
